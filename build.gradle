import de.thetaphi.forbiddenapis.gradle.CheckForbiddenApis
plugins {
    id 'java'
	id 'pmd'
	id 'de.thetaphi.forbiddenapis' version '3.10'
}

repositories {
    mavenLocal()
    maven {
        url = 'https://repo.runelite.net'
        content {
            includeGroupByRegex("net\\.runelite.*")
        }
    }
    mavenCentral()
}

def runeLiteVersion = 'latest.release'
def pluginMainClass = 'com.fogofwar.FogOfWarPlugin'
def runMainClass = 'com.fogofwar.FogOfWar'

dependencies {
	compileOnly "net.runelite:client:$runeLiteVersion"
	compileOnly 'org.jetbrains:annotations:23.0.0'
	testCompileOnly 'org.jetbrains:annotations:23.0.0'

    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

    testImplementation 'junit:junit:4.13.1'
	testImplementation "net.runelite:client:$runeLiteVersion"
	testImplementation "net.runelite:jshell:$runeLiteVersion"
}

group = 'com.fogofwar'
java {
	toolchain.languageVersion = JavaLanguageVersion.of(11)
}
pmd {
	toolVersion = '7.27.0'
	ruleSets = []
	ruleSetFiles = files('config/pmd/ruleset.xml')
	consoleOutput = true
}
tasks.withType(Pmd).configureEach {
	javaLauncher = javaToolchains.launcherFor(java.toolchain)
	classpath += files(javaLauncher.map { it.metadata.installationPath.file('lib/jrt-fs.jar') })
}
tasks.named('pmdMain', Pmd) {
	ruleSetFiles += files('config/pmd/runelite.xml')
}
tasks.withType(CheckForbiddenApis).configureEach {
	enabled = name == 'forbiddenApisMain'
	signaturesFiles = files('config/forbidden-apis/runelite.txt')
	failOnUnsupportedJava = true
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(11)
	options.compilerArgs.addAll(['-Xlint:all,-processing', '-Werror'])
}
tasks.withType(JavaExec).configureEach {
	javaLauncher = javaToolchains.launcherFor(java.toolchain)
}
tasks.register('run', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = runMainClass
    jvmArgs "-ea"
    args "--developer-mode", "--debug"
}

tasks.register('shadowJar', Jar) {
    manifest {
        attributes('Main-Class': pluginMainClass, 'Multi-Release': true)
    }

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from sourceSets.main.output
    from {
        configurations.runtimeClasspath.collect { file ->
            file.isDirectory() ? file : zipTree(file)
        }
    }

    exclude 'META-INF/INDEX.LIST'
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
    exclude '**/module-info.class'

    group = BasePlugin.BUILD_GROUP
    archiveClassifier.set('shadow')
    archiveFileName.set("${rootProject.name}-${project.version}-all.jar")
}
